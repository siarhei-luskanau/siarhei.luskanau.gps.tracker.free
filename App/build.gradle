apply plugin: "com.android.application"
apply plugin: "com.google.devtools.ksp"

android {
    namespace = "siarhei.luskanau.gps.tracker.free"
    compileSdk = project.COMPILE_SDK_VERSION

    defaultConfig {
        applicationId "siarhei.luskanau.gps.tracker.free"
        minSdkVersion project.MIN_SDK_VERSION
        targetSdkVersion project.TARGET_SDK_VERSION
        versionCode 34
        versionName '4.0.34'
        vectorDrawables.useSupportLibrary = true
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            signingConfig = signingConfigs.debug
            debuggable true
            minifyEnabled false
            proguardFile 'proguard.cfg'
        }
    }

}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set("Free_GPS_Tracker-" + android.defaultConfig.versionName + ".apk")
        }
    }
}

dependencies {
    debugImplementation libs.leakcanary.android
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation libs.android.query
    implementation libs.androidx.legacy.support.v4
    implementation libs.androidx.preference
    implementation libs.androidx.room3.runtime
    implementation libs.gson
    implementation libs.kotlinx.coroutines.android
    implementation libs.material
    implementation libs.okhttp
    implementation libs.play.services.gcm
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    implementation project(':Modules:AndroidBroadcastLib')
    implementation project(':Modules:AndroidDataLib')
    ksp libs.androidx.room3.compiler
}